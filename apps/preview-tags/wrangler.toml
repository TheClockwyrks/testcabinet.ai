# The preview-tag Worker, deployed by scripts/ci/deploy-workers.sh with
# `wrangler deploy --env <environment>`. The Public Gallery deployment page of
# the documentation site, section "The Workers", states its binding, its
# variables and its routes; "Staging" states the staging names.
#
# Bindings and variables are not inherited by an environment, so each states
# its own. The top level is what `wrangler dev` runs against, a local bucket.
name = "tcab-preview-tags-dev"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false

r2_buckets = [{ binding = "SNAPSHOT", bucket_name = "tcab-snapshot-dev" }]

[vars]
SHELL_ORIGIN = "http://localhost:1430"
SNAPSHOT_ORIGIN = "http://localhost:1430"

[env.production]
name = "tcab-preview-tags"
routes = [{ pattern = "testcabinet.ai/runs/*", zone_name = "testcabinet.ai" }]
r2_buckets = [{ binding = "SNAPSHOT", bucket_name = "tcab-snapshot" }]

[env.production.vars]
SHELL_ORIGIN = "https://the-test-cabinet.pages.dev"
SNAPSHOT_ORIGIN = "https://snapshot.testcabinet.ai"

[env.staging]
name = "tcab-preview-tags-staging"
routes = [
  { pattern = "staging.testcabinet.ai/runs/*", zone_name = "testcabinet.ai" },
]
r2_buckets = [{ binding = "SNAPSHOT", bucket_name = "tcab-snapshot-staging" }]

[env.staging.vars]
SHELL_ORIGIN = "https://the-test-cabinet-staging.pages.dev"
SNAPSHOT_ORIGIN = "https://snapshot.staging.testcabinet.ai"

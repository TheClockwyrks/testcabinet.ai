# The gallery's own jobs of the gates stage, which azure-pipelines.yml includes
# after the kit's jobs. It has none: every check it needs is a gate, which the
# kit gives a step of its own, and its deploy is a stage of its own
# (stages.yml). The kit includes this file in every repository whose
# PROJECT_PIPELINE row names stages, and hands it every parameter below, which
# the rendered ci/tests/test_wiring.py holds it to declaring.
parameters:
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

jobs: []

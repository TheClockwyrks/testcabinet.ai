# The gallery's own stages, which azure-pipelines.yml includes after the
# publish stage; the mirror waits on each. The kit hands every parameter below,
# and the rendered ci/tests/test_wiring.py holds this file to them and to the
# stages render.py's PROJECT_PIPELINE names.
#
# `deploy` builds the gallery and uploads it to its Cloudflare Pages project
# once every gate passed, on `master` and `staging` alone
# (scripts/ci/deploy-site.sh says which project each deploys to): `master` is
# testcabinet.ai and `staging` is staging.testcabinet.ai. The superrepo's
# Releasing page, section "Gallery (Cloudflare Pages and Workers, one-time)",
# says how the projects and the variables below are set up.
#
# The build bakes in nothing of the published dataset: it writes
# TCAB_SNAPSHOT_URL into the page, which reads the bucket there in the browser,
# so a publish reaches the gallery without a deploy. The pipeline definition
# holds one URL per branch, TCAB_SNAPSHOT_URL_MASTER and
# TCAB_SNAPSHOT_URL_STAGING, and the step is handed the one its branch names;
# the script refuses a value that is not an http(s) URL, which is what an
# undefined variable reaches it as, rather than deploy a gallery reading no
# bucket over the live one.
#
# The stage deploys the gallery's two Workers beside it, the preview tags and
# the tcab.ai share links, with `wrangler deploy` (scripts/ci/deploy-workers.sh
# says which environment each branch deploys): `master` their production
# environments and `staging` their staging ones. A Worker bundles from its own
# sources and reads the bucket at request time, so the job installs nothing.
#
# It runs in the web image, the Node the gates ran the gallery's build in.
# CLOUDFLARE_API_TOKEN (a token holding "Cloudflare Pages: Edit" and "Workers
# Scripts: Edit" on the account, and "Workers Routes: Edit" and "DNS: Edit" on
# the testcabinet.ai and tcab.ai zones) and CLOUDFLARE_ACCOUNT_ID are secret
# variables of the pipeline, so each is mapped into the step that uses it by
# name.
parameters:
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

stages:
  - stage: deploy
    displayName: Deploy
    # Named, so the stage follows the gates rather than the publish stage
    # before it, which a branch's run skips.
    dependsOn: gates
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    jobs:
      - job: site
        displayName: Build and deploy the gallery
        # An install, a build of the shell and an upload of its few files.
        timeoutInMinutes: 20
        container: web
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          # The gallery installs the project's packages from the feed.
          - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
            displayName: Authenticate npm to the package feed
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - script: scripts/ci/deploy-site.sh "$(Build.SourceBranchName)"
            displayName: Build and deploy the gallery
            env:
              CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
              ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
                TCAB_SNAPSHOT_URL: $(TCAB_SNAPSHOT_URL_MASTER)
              ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
                TCAB_SNAPSHOT_URL: $(TCAB_SNAPSHOT_URL_STAGING)
      - job: workers
        displayName: Deploy the Workers
        timeoutInMinutes: 15
        container: web
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - script: scripts/ci/deploy-workers.sh "$(Build.SourceBranchName)"
            displayName: Deploy the preview-tag and share-link Workers
            env:
              CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)

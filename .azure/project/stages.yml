# The gallery's own stages, which azure-pipelines.yml includes after the
# publish stage; the mirror waits on each. The kit hands every parameter below,
# and the rendered ci/tests/test_wiring.py holds this file to them and to the
# stages render.py's PROJECT_PIPELINE names.
#
# `deploy` builds the gallery and uploads it to its Cloudflare Pages project
# once every gate passed, on `master` and `staging` alone
# (scripts/ci/deploy-site.sh says which project each deploys to): `master` is
# testcabinet.ai and `staging` is staging.testcabinet.ai. The superrepo's
# Releasing page, section "Gallery (Cloudflare Pages and Workers, one-time)",
# says how the projects and the variables below are set up.
#
# The build fetches the published dataset from TCAB_SNAPSHOT_URL and bakes it
# into the bundle. The pipeline definition holds one URL per branch,
# TCAB_SNAPSHOT_URL_MASTER and TCAB_SNAPSHOT_URL_STAGING, and the step is handed
# the one its branch names; the script refuses a value that is not an http(s)
# URL, which is what an undefined variable reaches it as, rather than deploy an
# empty gallery over the live one.
#
# The two Workers the Releasing page deploys from this repository (the tcab.ai
# share links and the preview tags) do not exist here yet; their
# `wrangler deploy` steps join this stage with them.
#
# It runs in the web image, the Node the gates ran the gallery's build in.
# CLOUDFLARE_API_TOKEN (a token holding "Cloudflare Pages: Edit" and "Workers
# Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID are secret variables of the
# pipeline, so each is mapped into the step that uses it by name.
parameters:
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

stages:
  - stage: deploy
    displayName: Deploy
    # Named, so the stage follows the gates rather than the publish stage
    # before it, which a branch's run skips.
    dependsOn: gates
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    jobs:
      - job: site
        displayName: Build and deploy the gallery
        # The build fetches every published run's files from the bucket and
        # the upload sends thousands of them.
        timeoutInMinutes: 45
        container: web
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          # The gallery installs the project's packages from the feed.
          - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
            displayName: Authenticate npm to the package feed
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - script: scripts/ci/deploy-site.sh "$(Build.SourceBranchName)"
            displayName: Build and deploy the gallery
            env:
              CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
              ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
                TCAB_SNAPSHOT_URL: $(TCAB_SNAPSHOT_URL_MASTER)
              ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
                TCAB_SNAPSHOT_URL: $(TCAB_SNAPSHOT_URL_STAGING)
